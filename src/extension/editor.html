<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkScrape — Preview &amp; Edit Studio</title>
    <style>
      :root {
        --bg-root: #090d16;
        --bg-panel: #0f172a;
        --bg-header: #1e293b;
        --bg-input: #0b1120;
        --border-subtle: rgba(148, 163, 184, 0.18);
        --border-accent: rgba(59, 130, 246, 0.4);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg-root);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      .studio-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
      }

      /* Top Navigation & Action Bar */
      .studio-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        background: var(--bg-header);
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
        gap: 20px;
      }

      .brand-section {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, #0284c7 0%, #3b82f6 100%);
        color: #ffffff;
        font-weight: 800;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 3px 12px rgba(59, 130, 246, 0.35);
      }

      .page-meta {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .page-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 520px;
      }

      .page-url {
        font-size: 12px;
        color: #60a5fa;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 520px;
      }

      .page-url:hover {
        text-decoration: underline;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .stats-pill {
        font-size: 12.5px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.14);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.32);
        white-space: nowrap;
      }

      /* Split Main Content Area */
      .studio-main {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      /* Left Pane: Markdown Editor (60%) */
      .editor-pane {
        width: 60%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-subtle);
        background: var(--bg-panel);
        min-width: 0;
      }

      /* Right Pane: Image Toggle Grid (40%) */
      .gallery-pane {
        width: 40%;
        display: flex;
        flex-direction: column;
        background: var(--bg-panel);
        min-width: 0;
      }

      .pane-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 20px;
        background: rgba(30, 41, 59, 0.65);
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
        gap: 12px;
      }

      .pane-toolbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pane-heading {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
      }

      .char-badge {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-muted);
        background: rgba(15, 23, 42, 0.75);
        padding: 2px 9px;
        border-radius: 6px;
        border: 1px solid var(--border-subtle);
      }

      .fm-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
      }

      .fm-toggle input[type='checkbox'] {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
        cursor: pointer;
      }

      .markdown-textarea {
        flex: 1;
        width: 100%;
        min-height: 0;
        border: none;
        outline: none;
        resize: none;
        padding: 22px 24px;
        background: var(--bg-input);
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 13.5px;
        line-height: 1.65;
        overflow-y: auto;
        tab-size: 2;
      }

      .markdown-textarea:focus {
        box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35);
      }

      /* Right Pane Image Curation Grid */
      .toggle-all-btn {
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        background: #1e293b;
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.35);
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .toggle-all-btn:hover:not(:disabled) {
        background: rgba(59, 130, 246, 0.2);
        color: #93c5fd;
      }

      .toggle-all-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .image-grid {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 18px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
        gap: 14px;
        align-content: start;
      }

      .empty-gallery {
        grid-column: 1 / -1;
        padding: 48px 24px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13.5px;
        border: 1px dashed var(--border-subtle);
        border-radius: 12px;
      }

      .img-card {
        background: #1e293b;
        border: 1px solid var(--border-accent);
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        transition: opacity 0.18s ease, transform 0.15s ease, border-color 0.15s ease, filter 0.18s ease;
        user-select: none;
      }

      .img-card:hover {
        transform: translateY(-2px);
        border-color: #60a5fa;
      }

      .img-card.dimmed {
        opacity: 0.4;
        filter: grayscale(75%);
        border-color: var(--border-subtle);
      }

      .thumb-container {
        position: relative;
        width: 100%;
        height: 130px;
        background: #0b1120;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .thumb-img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }

      .dim-badge {
        position: absolute;
        bottom: 7px;
        left: 7px;
        font-size: 10.5px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 5px;
        background: rgba(15, 23, 42, 0.86);
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
      }

      .card-checkbox-wrap {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(15, 23, 42, 0.85);
        border-radius: 6px;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }

      .card-checkbox {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .card-meta {
        padding: 9px 11px;
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }

      .card-alt {
        font-size: 12px;
        font-weight: 500;
        color: #e2e8f0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Bottom Footer Bar */
      .studio-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px;
        background: var(--bg-header);
        border-top: 1px solid var(--border-subtle);
        flex-shrink: 0;
        gap: 20px;
      }

      .footer-left {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
        flex: 1;
      }

      .footer-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .progress-box {
        display: none;
        align-items: center;
        gap: 12px;
        flex: 1;
        max-width: 420px;
      }

      .progress-box.visible {
        display: flex;
      }

      .progress-track {
        width: 140px;
        height: 7px;
        background: rgba(15, 23, 42, 0.85);
        border-radius: 999px;
        overflow: hidden;
        flex-shrink: 0;
        border: 1px solid var(--border-subtle);
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0284c7 0%, #3b82f6 100%);
        transition: width 0.2s ease;
      }

      .progress-fill.complete {
        background: var(--success);
      }

      .progress-text {
        font-size: 12.5px;
        font-weight: 500;
        color: #93c5fd;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .progress-text.complete {
        color: #34d399;
      }

      .progress-text.error {
        color: #f87171;
      }

      .btn {
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.15s ease;
        white-space: nowrap;
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .btn-ghost {
        background: rgba(15, 23, 42, 0.7);
        color: var(--text-secondary);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }

      .btn-ghost:hover:not(:disabled) {
        background: rgba(51, 65, 85, 0.85);
        color: #ffffff;
        border-color: rgba(148, 163, 184, 0.45);
      }

      .btn-secondary {
        background: var(--bg-panel);
        color: var(--text-primary);
        border: 1px solid var(--border-accent);
      }

      .btn-secondary:hover:not(:disabled) {
        background: rgba(59, 130, 246, 0.16);
        border-color: #60a5fa;
      }

      .btn-secondary.copied {
        background: rgba(16, 185, 129, 0.18);
        color: #34d399;
        border-color: rgba(16, 185, 129, 0.5);
      }

      .btn-primary {
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
        transform: translateY(-1px);
      }

      /* Obsidian Settings Drawer Bar & Footer Buttons */
      .obsidian-settings-bar {
        display: none;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        padding: 10px 24px;
        background: rgba(124, 58, 237, 0.1);
        border-top: 1px solid rgba(124, 58, 237, 0.3);
        flex-shrink: 0;
      }

      .obsidian-settings-bar.open {
        display: flex;
      }

      .obsidian-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .vault-status {
        font-size: 12px;
        font-weight: 600;
        color: #cbd5e1;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.22);
      }

      .vault-status.linked {
        color: #ddd6fe;
        border-color: rgba(124, 58, 237, 0.45);
        background: rgba(124, 58, 237, 0.16);
      }

      .vault-small-btn {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 600;
        background: #1e293b;
        color: #c4b5fd;
        border: 1px solid rgba(124, 58, 237, 0.4);
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .vault-small-btn:hover:not(:disabled) {
        background: rgba(124, 58, 237, 0.25);
        color: #ede9fe;
        border-color: #8b5cf6;
      }

      .obsidian-field-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #e2e8f0;
      }

      .obsidian-subfolder-input {
        width: 130px;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid rgba(124, 58, 237, 0.4);
        background: #0b1120;
        color: #f8fafc;
        font-size: 12px;
        outline: none;
      }

      .obsidian-check-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #e2e8f0;
        cursor: pointer;
        user-select: none;
      }

      .obsidian-check-label input[type='checkbox'] {
        accent-color: #7c3aed;
        width: 14px;
        height: 14px;
        cursor: pointer;
      }

      .obsidian-btn-cluster {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .btn-obsidian-gear {
        padding: 10px 11px;
        background: rgba(124, 58, 237, 0.16);
        color: #ddd6fe;
        border: 1px solid rgba(124, 58, 237, 0.4);
      }

      .btn-obsidian-gear:hover:not(:disabled),
      .btn-obsidian-gear.active {
        background: rgba(124, 58, 237, 0.32);
        border-color: #8b5cf6;
      }

      .btn-obsidian {
        background: #7c3aed;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(124, 58, 237, 0.38);
      }

      .btn-obsidian:hover:not(:disabled) {
        background: #6d28d9;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="studio-layout">
      <!-- Top Header -->
      <header class="studio-header">
        <div class="brand-section">
          <div class="brand-logo">M</div>
          <div class="page-meta">
            <h1 id="page-title" class="page-title">Loading scraped content...</h1>
            <a id="page-url" class="page-url" href="#" target="_blank" rel="noopener noreferrer"></a>
          </div>
        </div>
        <div class="header-right">
          <span id="header-stats-pill" class="stats-pill">0 words • 0 images selected</span>
        </div>
      </header>

      <!-- Split-Pane Main Workspace -->
      <main class="studio-main">
        <!-- Left Pane: Live Markdown Editor -->
        <section class="editor-pane">
          <div class="pane-toolbar">
            <div class="pane-toolbar-left">
              <span class="pane-heading">Markdown Editor</span>
              <span id="editor-char-badge" class="char-badge">0 words · 0 chars</span>
            </div>
            <label class="fm-toggle" for="frontmatter-checkbox">
              <input type="checkbox" id="frontmatter-checkbox" checked />
              <span>Include YAML Frontmatter</span>
            </label>
          </div>
          <textarea
            id="markdown-textarea"
            class="markdown-textarea"
            spellcheck="false"
            placeholder="Scraped Markdown content will appear here..."
          ></textarea>
        </section>

        <!-- Right Pane: Interactive Image Curation Grid -->
        <section class="gallery-pane">
          <div class="pane-toolbar">
            <span id="gallery-count-heading" class="pane-heading">Images (0/0 selected)</span>
            <button id="toggle-all-btn" class="toggle-all-btn" type="button">Toggle All</button>
          </div>
          <div id="image-grid" class="image-grid"></div>
        </section>
      </main>

      <!-- Obsidian Settings Drawer Bar -->
      <div id="obsidian-settings-bar" class="obsidian-settings-bar open">
        <div class="obsidian-group">
          <span id="vault-status-text" class="vault-status">📁 No Vault Linked</span>
          <button id="change-vault-btn" class="vault-small-btn" type="button">
            Change Vault Folder...
          </button>
        </div>
        <label class="obsidian-field-label" for="obsidian-subfolder-input">
          <span>Subfolder:</span>
          <input
            type="text"
            id="obsidian-subfolder-input"
            class="obsidian-subfolder-input"
            value="Clippings"
            placeholder="Clippings"
          />
        </label>
        <label class="obsidian-check-label" for="obsidian-wikilinks-checkbox">
          <input type="checkbox" id="obsidian-wikilinks-checkbox" />
          <span>Use ![[Wikilinks]] for images</span>
        </label>
        <label class="obsidian-check-label" for="obsidian-auto-open-checkbox">
          <input type="checkbox" id="obsidian-auto-open-checkbox" checked />
          <span>Open note in Obsidian after saving</span>
        </label>
        <button id="obsidian-uri-only-btn" class="vault-small-btn" type="button">
          ↗ Send via URI Only
        </button>
      </div>

      <!-- Footer Action Bar -->
      <footer class="studio-footer">
        <div class="footer-left">
          <button id="repick-btn" class="btn btn-ghost" type="button">
            <span>🎯 Re-pick Element on Page</span>
          </button>
          <div id="progress-box" class="progress-box">
            <div class="progress-track">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="progress-text" class="progress-text"></span>
          </div>
        </div>
        <div class="footer-right">
          <button id="copy-md-btn" class="btn btn-secondary" type="button">
            <span>📋 Copy Markdown</span>
          </button>
          <div class="obsidian-btn-cluster">
            <button
              id="obsidian-gear-btn"
              class="btn btn-obsidian-gear active"
              type="button"
              title="Toggle Obsidian Vault Settings"
            >
              ⚙️
            </button>
            <button id="save-obsidian-btn" class="btn btn-obsidian" type="button">
              <span>🟣 Save to Obsidian</span>
            </button>
          </div>
          <button id="download-zip-btn" class="btn btn-primary" type="button">
            <span>📦 Download .ZIP (0 Images)</span>
          </button>
        </div>
      </footer>
    </div>

    <script type="module" src="./editor.js"></script>
  </body>
</html>
